name: Build Android APKs

# Both menus always use the same source revision and engine. Only master
# publishes: one regular release containing exactly the two signed APKs.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;23.2.8568313" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Check package policy and HTTP downloads
        run: |
          mkdir -p build/java-policy
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d build/java-policy \
            app/src/main/java/com/ast/ut99/UT99Paths.java \
            app/src/main/java/com/ast/ut99/Ut99RedirectDownload.java \
            app/src/main/java/com/ast/ut99/Ut99DiscImage.java \
            tools/java_tests/SystemPackageAudit.java \
            tools/java_tests/DiscImageAudit.java \
            tools/java_tests/RedirectDownloadAudit.java
          java -cp "build/java-policy:$ANDROID_HOME/platforms/android-35/android.jar" com.ast.ut99.SystemPackageAudit build/package-policy-tests
          java -cp build/java-policy com.ast.ut99.RedirectDownloadAudit --self-test
          java -cp build/java-policy com.ast.ut99.DiscImageAudit --self-test

      - name: Build both menus
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleNormalRelease assembleClassicRelease

      - name: Verify shared engine and assets
        run: python3 tools/check_menu_variants.py

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          version="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -n 1)"
          mkdir dist
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          elif [ "$GITHUB_REF" = refs/heads/master ]; then
            echo "::error::Publishing both menus requires the Android signing key"
            exit 1
          else
            echo "::warning::No signing key: test artifacts will be unsigned"
          fi
          for flavor in classic normal; do
            menu=classic
            if [ "$flavor" = normal ]; then menu=console; fi
            in="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            out="dist/UT99-Android-$version-fr-$menu-menu-release.apk"
            if [ -n "$KEYSTORE" ]; then
              "$tools/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk"
              "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "${ALIAS:-ut99}" \
                --ks-pass env:PASSWORD --key-pass env:PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
              "$tools/apksigner" verify "$out"
            else
              cp "$in" "${out%.apk}-unsigned.apk"
            fi
          done
          rm -f dist/*.idsig
          set -- dist/*.apk
          [ "$#" -eq 2 ]

      - uses: actions/upload-artifact@v4
        with:
          name: UT99-Android-Classic-and-Console-APKs
          path: dist/*.apk
          retention-days: 14

      - name: Publish release with both menus
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'/\1/p" app/build.gradle | head -1)
          tag="v$version-build$GITHUB_RUN_NUMBER"
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then tag="$tag.$GITHUB_RUN_ATTEMPT"; fi
          # Notes for this version from CHANGELOG.md, up to the next version heading.
          awk -v v="## $version" '$0==v{on=1;next} on&&/^## /{exit} on' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          : > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            printf "## What's new in %s\n" "$version" >> "$RUNNER_TEMP/notes.md"
            cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/notes.md"
            printf '\nFull changelog: %s/%s/blob/%s/CHANGELOG.md\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$RUNNER_TEMP/notes.md"
          fi
          printf '%s\n\n%s\n\n%s\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' \
            'Deux APK signés : classic-menu pour le menu UT99 classique ; console-menu pour le menu console / téléphone.' \
            'Même moteur Android natif, mêmes correctifs et mêmes données dans les deux variantes. Installer une variante remplace l’autre en conservant les données.' \
            'Données du jeu non incluses. Import personnel ou installation GOTY depuis OldUnreal avec choix de langue et stockage interne/microSD. Les fichiers v400 et 469f sont pris en charge ; certaines extensions et certains mods restent à adapter. Voir docs/GOTY_COMPATIBILITY.md.' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/*-classic-menu-release.apk dist/*-console-menu-release.apk \
            --target "$GITHUB_SHA" --latest \
            --title "UT99 Android $version — Menus classique et console (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$RUNNER_TEMP/notes.md"
