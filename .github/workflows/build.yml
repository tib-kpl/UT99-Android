name: Build Android APKs

# Builds the release APKs of both flavors (normal: phones, tablets, TV, OUYA;
# automotive: Android Automotive OS) on every push, and signs them with the
# ANDROID_KEYSTORE_BASE64 secret (a keystore, base64), ANDROID_KEYSTORE_PASSWORD
# (its password and the key's) and ANDROID_KEY_ALIAS, so each build installs
# over the one before. Without the secrets the APKs are left unsigned.
# A successful build of the default branch is published as a GitHub release.
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # the versions app/build.gradle asks for
      - name: Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;23.2.8568313" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build
        env:
          CONSOLE_MENU: ${{ github.ref == 'refs/heads/feat/console-menu' }}
          GOTY_COMPAT: ${{ github.ref == 'refs/heads/feat/oldunreal-goty-compat' }}
        run: |
          chmod +x gradlew
          if [ "$CONSOLE_MENU" = true ] || [ "$GOTY_COMPAT" = true ]; then
            ./gradlew --console=plain assembleNormalRelease
          else
            ./gradlew --console=plain assembleNormalRelease assembleAutomotiveRelease
          fi

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONSOLE_MENU: ${{ github.ref == 'refs/heads/feat/console-menu' }}
          GOTY_COMPAT: ${{ github.ref == 'refs/heads/feat/oldunreal-goty-compat' }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          version="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle | head -n 1)"
          mkdir dist
          flavors="normal automotive"
          label=""
          if [ "$CONSOLE_MENU" = true ]; then
            flavors="normal"
            label="-console-menu"
          elif [ "$GOTY_COMPAT" = true ]; then
            flavors="normal"
            label="-goty-compat"
          fi
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APKs are unsigned"
          fi
          for flavor in $flavors; do
            in="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            out="dist/UT99-Android-$version-fr$label-$flavor-release.apk"
            if [ -n "$KEYSTORE" ]; then
              "$tools/zipalign" -f -p 4 "$in" "$RUNNER_TEMP/aligned.apk"
              "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "${ALIAS:-ut99}" \
                --ks-pass env:PASSWORD --key-pass env:PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
              "$tools/apksigner" verify "$out"
            else
              cp "$in" "${out%.apk}-unsigned.apk"
            fi
          done
          rm -f "$RUNNER_TEMP/release.jks" dist/*.idsig
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/feat/console-menu' && 'UT99-Android-Console-Menu-APK' || github.ref == 'refs/heads/feat/oldunreal-goty-compat' && 'UT99-Android-GOTY-Compat-APK' || 'UT99-Android-APK' }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish console menu prerelease
        if: github.ref == 'refs/heads/feat/console-menu'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="console-menu-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          printf '%s\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' \
            'Version du menu console/PC de la branche feat/console-menu. Les APK unsigned nécessitent une signature avant installation.' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/console-menu-notes.md"
          gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "UT99 — Menu console/PC (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$RUNNER_TEMP/console-menu-notes.md"

      - name: Publish GOTY compatibility prerelease
        if: github.ref == 'refs/heads/feat/oldunreal-goty-compat'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="goty-compat-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          printf '%s\n\n%s\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' \
            'Experimental native Android build: console menu, collision fixes and GOTY content compatibility.' \
            'Requires v400-compatible System packages with GOTY maps/textures/sounds/music. This is not the OldUnreal 469 engine. See docs/GOTY_COMPATIBILITY.md. Game data is not included. Unsigned APKs require signing before installation.' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/goty-compat-notes.md"
          gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "UT99 GOTY compatibility (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$RUNNER_TEMP/goty-compat-notes.md"

      # a successful build of the default branch becomes a GitHub release
      # (build-<run number>, marked latest, the APKs attached); the last five
      # build-* releases are kept
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          subject="$(printf '%s' "${MESSAGE:-manual run}" | head -n 1)"
          printf '%s\n\nCommit: %s/%s/commit/%s\nBuild: %s/%s/actions/runs/%s\n' "$subject" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --latest \
            --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" --notes-file "$RUNNER_TEMP/notes.md"
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
